name: zsk-restart-tests
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: zsk_restart_tests
      POSTGRES_USER: manufacturing
      POSTGRES_PASSWORD: ${MANUFACTURING_DB_PASSWORD:?Required}
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U manufacturing -d zsk_restart_tests"]
      interval: 2s
      timeout: 3s
      retries: 20
  api:
    image: zsk-ml:local
    environment:
      ZSK_DB_HOST: db
      ZSK_DB_NAME: zsk_restart_tests
      ZSK_DB_PASSWORD: ${MANUFACTURING_DB_PASSWORD:?Required}
      ZSK_API_KEY: ${ZSK_API_KEY:?Required}
      ZSK_ADMIN_API_KEY: ${ZSK_ADMIN_API_KEY:?Required}
    volumes: ["models:/data/models"]
    depends_on:
      db:
        condition: service_healthy
volumes:
  models:
